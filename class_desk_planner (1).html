<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Seating Plan Planner</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    function App() {
      // Navigation State
      const [activeTab, setActiveTab] = useState('students'); // 'students' | 'studio'

      // Classroom Layout Configuration
      const [rows, setRows] = useState(6);
      const [cols, setCols] = useState(6);
      const [groupSize, setGroupSize] = useState(2); // 1 = Single, 2 = Paired
      const [oddAisleAlignment, setOddAisleAlignment] = useState('right');
      const [teacherBenchPos, setTeacherBenchPos] = useState('center');
      const [viewAngle, setViewAngle] = useState('teacher');
      const [showCoordinates, setShowCoordinates] = useState(true);

      // Seat Restrictions Status: { "row-col": "available" | "restricted" | "unavailable" }
      const [seatStatuses, setSeatStatuses] = useState({});

      // Student Roster State
      const [pasteInput, setPasteInput] = useState('');
      const [students, setStudents] = useState([
        { id: '1', classNo: '1', nameZh: '陳大文', nameEn: 'Chan Tai Man', gender: 'M', specialNeeds: 'Vision', prioritizeFront: true, isTall: false },
        { id: '2', classNo: '2', nameZh: '張小慧', nameEn: 'Cheung Siu Wai', gender: 'F', specialNeeds: '', prioritizeFront: false, isTall: false },
        { id: '3', classNo: '3', nameZh: '李華', nameEn: 'Lee Wa', gender: 'M', specialNeeds: 'ADHD', prioritizeFront: true, isTall: true },
        { id: '4', classNo: '4', nameZh: '黃麗萍', nameEn: 'Wong Lai Ping', gender: 'F', specialNeeds: '', prioritizeFront: false, isTall: true },
        { id: '5', classNo: '5', nameZh: '趙子龍', nameEn: 'Chiu Tsz Lung', gender: 'M', specialNeeds: '', prioritizeFront: false, isTall: false },
        { id: '6', classNo: '6', nameZh: '林雅婷', nameEn: 'Lam Nga Ting', gender: 'F', specialNeeds: '', prioritizeFront: false, isTall: false },
        { id: '7', classNo: '7', nameZh: '黃偉強', nameEn: 'Wong Wai Keung', gender: 'M', specialNeeds: '', prioritizeFront: false, isTall: true },
        { id: '8', classNo: '8', nameZh: '周美玲', nameEn: 'Chow Mei Ling', gender: 'F', specialNeeds: 'Hearing', prioritizeFront: true, isTall: false },
      ]);

      // Seating Assignments Grid: { "row-col": studentObject }
      const [seatingPlan, setSeatingPlan] = useState({});
      const [draggedSeatKey, setDraggedSeatKey] = useState(null);

      // Right-Click Context Menu State
      const [contextMenu, setContextMenu] = useState(null);

      // Auto-Arrangement Configuration
      const [arrangeMode, setArrangeMode] = useState('colByCol'); // 'colByCol' | 'custom'
      const [chronoDirection, setChronoDirection] = useState('ltr'); // 'ltr' | 'rtl'
      const [chronoPattern, setChronoPattern] = useState('col'); // 'col' | 'row'

      const [customReqs, setCustomReqs] = useState({
        tallInBack: false,
        specialNeedsFront: true,
        genderMix: false,
        randomizeRemaining: false
      });

      const [alertMsg, setAlertMsg] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Parse pasted Excel tab-separated values
      const handlePasteProcess = () => {
        if (!pasteInput.trim()) {
          showAlert('Please paste table data from Excel first.', 'error');
          return;
        }

        const lines = pasteInput.trim().split('\n');
        const newStudents = [];

        lines.forEach((line, index) => {
          const cells = line.split('\t').map(c => c.trim());
          if (cells.length >= 2) {
            if (index === 0 && (cells[0].toLowerCase().includes('no') || cells[1].includes('名'))) {
              return;
            }

            const classNo = cells[0] || `${index + 1}`;
            const nameZh = cells[1] || '';
            const nameEn = cells[2] || '';
            const genderRaw = (cells[3] || '').toUpperCase();
            const gender = genderRaw.startsWith('F') || genderRaw.includes('女') ? 'F' : 'M';
            const specialNeeds = cells[4] || '';

            newStudents.push({
              id: `stu-${Date.now()}-${index}`,
              classNo,
              nameZh,
              nameEn,
              gender,
              specialNeeds,
              prioritizeFront: specialNeeds.trim().length > 0,
              isTall: false
            });
          }
        });

        if (newStudents.length > 0) {
          setStudents(newStudents);
          setPasteInput('');
          showAlert(`Successfully imported ${newStudents.length} students!`, 'success');
        } else {
          showAlert('Could not parse Excel data. Ensure columns match: Class No, Chinese Name, English Name, Gender, Special Needs.', 'error');
        }
      };

      const toggleStudentHeight = (id) => {
        setStudents(prev => prev.map(s => s.id === id ? { ...s, isTall: !s.isTall } : s));
      };

      const toggleStudentFrontPriority = (id) => {
        setStudents(prev => prev.map(s => s.id === id ? { ...s, prioritizeFront: !s.prioritizeFront } : s));
      };

      // Seat Relocation when Blocked
      const findNextEmptySeat = (currentPlan, currentStatuses, excludeKey) => {
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const key = `${r}-${c}`;
            if (key !== excludeKey && currentStatuses[key] !== 'unavailable' && !currentPlan[key]) {
              return key;
            }
          }
        }
        return null;
      };

      const changeSeatStatus = (r, c, targetStatus) => {
        const key = `${r}-${c}`;
        const student = seatingPlan[key];

        setSeatStatuses(prev => ({ ...prev, [key]: targetStatus }));

        if (targetStatus === 'unavailable' && student) {
          const nextSeatKey = findNextEmptySeat(seatingPlan, { ...seatStatuses, [key]: 'unavailable' }, key);
          const newPlan = { ...seatingPlan };
          delete newPlan[key];

          if (nextSeatKey) {
            newPlan[nextSeatKey] = student;
            setSeatingPlan(newPlan);
            showAlert(`Seat ${r+1}-${c+1} blocked. Student #${student.classNo} moved to ${nextSeatKey.replace('-', '-')}.`, 'info');
          } else {
            setSeatingPlan(newPlan);
            showAlert(`Seat ${r+1}-${c+1} blocked. Student #${student.classNo} unseated (no available empty desks).`, 'warning');
          }
        }

        setContextMenu(null);
      };

      const toggleSeatStatus = (r, c) => {
        const key = `${r}-${c}`;
        const current = seatStatuses[key] || 'available';
        let next = 'available';
        if (current === 'available') next = 'restricted';
        else if (current === 'restricted') next = 'unavailable';
        else next = 'available';

        changeSeatStatus(r, c, next);
      };

      const handleContextMenu = (e, r, c) => {
        e.preventDefault();
        setContextMenu({
          x: e.clientX,
          y: e.clientY,
          r,
          c,
          key: `${r}-${c}`
        });
      };

      const handleGlobalClick = () => {
        if (contextMenu) setContextMenu(null);
      };

      // Auto Arrangement Logic
      const generatePlan = () => {
        const validSeatKeys = [];

        if (arrangeMode === 'colByCol') {
          const colStart = chronoDirection === 'ltr' ? 0 : cols - 1;
          const colEnd = chronoDirection === 'ltr' ? cols : -1;
          const colStep = chronoDirection === 'ltr' ? 1 : -1;

          if (chronoPattern === 'col') {
            for (let c = colStart; c !== colEnd; c += colStep) {
              for (let r = 0; r < rows; r++) {
                const key = `${r}-${c}`;
                if (seatStatuses[key] !== 'unavailable') {
                  validSeatKeys.push({ r, c, key });
                }
              }
            }
          } else {
            for (let r = 0; r < rows; r++) {
              for (let c = colStart; c !== colEnd; c += colStep) {
                const key = `${r}-${c}`;
                if (seatStatuses[key] !== 'unavailable') {
                  validSeatKeys.push({ r, c, key });
                }
              }
            }
          }
        } else {
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const key = `${r}-${c}`;
              if (seatStatuses[key] !== 'unavailable') {
                validSeatKeys.push({ r, c, key });
              }
            }
          }
        }

        if (students.length > validSeatKeys.length) {
          showAlert(`Warning: ${students.length} students but only ${validSeatKeys.length} available seats.`, 'warning');
        }

        let sortedStudents = [...students];

        if (arrangeMode === 'colByCol') {
          sortedStudents.sort((a, b) => parseInt(a.classNo) - parseInt(b.classNo));
        } else {
          sortedStudents.sort((a, b) => {
            if (customReqs.specialNeedsFront) {
              const aHas = !!a.prioritizeFront;
              const bHas = !!b.prioritizeFront;
              if (aHas !== bHas) return aHas ? -1 : 1;
            }

            if (customReqs.tallInBack) {
              if (a.isTall !== b.isTall) return a.isTall ? 1 : -1;
            }

            return parseInt(a.classNo) - parseInt(b.classNo);
          });

          if (customReqs.genderMix) {
            const males = sortedStudents.filter(s => s.gender === 'M');
            const females = sortedStudents.filter(s => s.gender === 'F');
            const mixed = [];
            let m = 0, f = 0;
            while (m < males.length || f < females.length) {
              if (m < males.length) mixed.push(males[m++]);
              if (f < females.length) mixed.push(females[f++]);
            }
            sortedStudents = mixed;
          }

          if (customReqs.randomizeRemaining) {
            sortedStudents.sort(() => Math.random() - 0.5);
          }
        }

        const newPlan = {};
        validSeatKeys.forEach((seat, idx) => {
          if (idx < sortedStudents.length) {
            newPlan[seat.key] = sortedStudents[idx];
          }
        });

        setSeatingPlan(newPlan);
        showAlert('Seating plan generated successfully!', 'success');
      };

      // Drag & Drop Swapping
      const handleDragStart = (e, key) => {
        setDraggedSeatKey(key);
        e.dataTransfer.setData('text/plain', key);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDrop = (e, targetKey) => {
        e.preventDefault();
        if (!draggedSeatKey || draggedSeatKey === targetKey) return;

        if (seatStatuses[targetKey] === 'unavailable') {
          showAlert('Cannot move student to an unavailable seat.', 'error');
          return;
        }

        setSeatingPlan(prev => {
          const updated = { ...prev };
          const temp = updated[targetKey];
          updated[targetKey] = updated[draggedSeatKey];
          if (temp) {
            updated[draggedSeatKey] = temp;
          } else {
            delete updated[draggedSeatKey];
          }
          return updated;
        });

        setDraggedSeatKey(null);
      };

      const showAlert = (msg, type = 'info') => {
        setAlertMsg({ msg, type });
        setTimeout(() => setAlertMsg(null), 4000);
      };

      const getStudentBenchPos = (pos) => {
        if (pos === 'left') return 'right';
        if (pos === 'right') return 'left';
        return 'center';
      };

      const effectiveBenchPos = viewAngle === 'teacher' 
        ? teacherBenchPos 
        : getStudentBenchPos(teacherBenchPos);

      const rowIndices = viewAngle === 'teacher'
        ? Array.from({ length: rows }, (_, i) => rows - 1 - i)
        : Array.from({ length: rows }, (_, i) => i);

      const colIndices = viewAngle === 'teacher'
        ? Array.from({ length: cols }, (_, i) => i)
        : Array.from({ length: cols }, (_, i) => cols - 1 - i);

      // Helper to check if a physical aisle boundary exists after physical column index k
      const hasPhysicalAisleAfter = (k) => {
        if (groupSize !== 2) return false;
        if (k < 0 || k >= cols - 1) return false;

        const isOddCols = cols % 2 !== 0;

        if (!isOddCols) {
          return (k + 1) % 2 === 0;
        } else {
          if (oddAisleAlignment === 'left') {
            return k % 2 === 0;
          } else {
            return (k + 1) % 2 === 0;
          }
        }
      };

      // Correctly evaluates aisle presence after rendered column 'c' based on perspective
      const isAisleAfterColumn = (c) => {
        if (viewAngle === 'teacher') {
          return hasPhysicalAisleAfter(c);
        } else {
          return hasPhysicalAisleAfter(c - 1);
        }
      };

      // Responsive Desk Sizing Classes depending on column count
      const getDeskSizeClasses = () => {
        if (cols >= 10) {
          return {
            card: 'w-20 h-20 sm:w-22 sm:h-22 p-1.5',
            title: 'text-xs',
            sub: 'text-[8px]',
            badge: 'px-1 py-0.2 text-[10px]',
            coord: 'text-[8px]',
            aisle: 'w-2 sm:w-3'
          };
        } else if (cols >= 8) {
          return {
            card: 'w-24 h-24 sm:w-26 sm:h-26 p-1.5',
            title: 'text-xs sm:text-sm',
            sub: 'text-[9px]',
            badge: 'px-1.5 py-0.5 text-xs',
            coord: 'text-[9px]',
            aisle: 'w-2.5 sm:w-4'
          };
        } else {
          return {
            card: 'w-28 h-28 sm:w-32 sm:h-32 p-2',
            title: 'text-sm sm:text-base',
            sub: 'text-[10px]',
            badge: 'px-2 py-0.5 text-xs sm:text-sm',
            coord: 'text-[10px]',
            aisle: 'w-3 sm:w-5'
          };
        }
      };

      const deskStyle = getDeskSizeClasses();

      // DOC Export
      const exportAsDoc = () => {
        let htmlContent = `
          <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
          <head><title>Seating Plan</title>
          <style>
            body { font-family: Arial, sans-serif; font-size: 12pt; }
            h1 { text-align: center; color: #1e293b; }
            .meta { text-align: center; font-size: 10pt; color: #64748b; margin-bottom: 20px; }
            .bench { background-color: #1e293b; color: white; text-align: center; font-weight: bold; padding: 10px; margin: 15px 0; border-radius: 5px; }
            table { border-collapse: collapse; width: 100%; margin-top: 10px; }
            td, th { border: 1px solid #cbd5e1; padding: 10px; text-align: center; font-size: 10pt; }
            .student-cell { background-color: #f8fafc; font-weight: bold; }
            .blocked { background-color: #e2e8f0; color: #94a3b8; }
            .aisle { width: 15px; background-color: #ffffff; border: none; }
          </style>
          </head>
          <body>
            <h1>CLASSROOM SEATING PLAN</h1>
            <div class="meta">Perspective: ${viewAngle.toUpperCase()} VIEW | Total Seated: ${Object.keys(seatingPlan).length} / ${students.length}</div>
            
            ${viewAngle === 'student' ? `<div class="bench">TEACHER BENCH / BLACKBOARD (FRONT)</div>` : ''}

            <table>
              ${rowIndices.map(r => `
                <tr>
                  <th style="width: 50px; background-color: #f1f5f9;">R${r + 1}</th>
                  ${colIndices.map(c => {
                    const key = `${r}-${c}`;
                    const student = seatingPlan[key];
                    const status = seatStatuses[key] || 'available';
                    const hasAisle = isAisleAfterColumn(c);

                    let cellHtml = '';
                    if (status === 'unavailable') {
                      cellHtml = `<td class="blocked">Blocked</td>`;
                    } else if (student) {
                      cellHtml = `
                        <td class="student-cell">
                          <div style="color: #2563eb; font-size: 9pt;">#${student.classNo}</div>
                          <div>${student.nameZh || ''} ${student.nameEn || ''}</div>
                        </td>`;
                    } else {
                      cellHtml = `<td>Empty</td>`;
                    }

                    return cellHtml + (hasAisle ? `<td class="aisle"></td>` : '');
                  }).join('')}
                </tr>
              `).join('')}
            </table>

            ${viewAngle === 'teacher' ? `<div class="bench">TEACHER BENCH / BLACKBOARD (FRONT)</div>` : ''}
          </body>
          </html>
        `;

        const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `Seating_Plan_${new Date().toISOString().slice(0,10)}.doc`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showAlert('Exported as Word Document (.doc)!', 'success');
      };

      // High-Resolution Ultra-Clear Image Export (300 DPI Print Quality)
      const exportHighResImage = (format = 'jpg') => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        // Scale factor of 3x creates ~300 DPI print quality image resolution
        const scale = 3;

        const cardSize = 130;
        const gap = 16;
        const aisleGap = 32;
        const headerHeight = 110;
        const benchHeight = 65;

        let totalColsWidth = 0;
        colIndices.forEach((c) => {
          totalColsWidth += cardSize;
          if (isAisleAfterColumn(c)) totalColsWidth += aisleGap;
          else totalColsWidth += gap;
        });

        const unscaledWidth = Math.max(1000, totalColsWidth + 140);
        const unscaledHeight = headerHeight + benchHeight + (rows * (cardSize + gap)) + 150;

        // Multiply canvas physical pixel dimensions by scale factor
        canvas.width = Math.round(unscaledWidth * scale);
        canvas.height = Math.round(unscaledHeight * scale);

        // Apply scaling to 2D context
        ctx.scale(scale, scale);

        // High-quality anti-aliased font and line rendering
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        // Background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, unscaledWidth, unscaledHeight);

        // Header Title
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CLASSROOM SEATING PLAN', unscaledWidth / 2, 45);

        ctx.fillStyle = '#64748b';
        ctx.font = '500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillText(`Perspective: ${viewAngle.toUpperCase()} VIEW | Total Seated: ${Object.keys(seatingPlan).length} / ${students.length}`, unscaledWidth / 2, 72);

        let currentY = headerHeight;

        // Front Teacher Bench (if Student POV)
        if (viewAngle === 'student') {
          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(unscaledWidth / 2 - 200, currentY, 400, benchHeight - 15, 10);
          } else {
            ctx.rect(unscaledWidth / 2 - 200, currentY, 400, benchHeight - 15);
          }
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('👩‍🏫 TEACHER BENCH / BLACKBOARD (FRONT)', unscaledWidth / 2, currentY + 31);
          currentY += benchHeight + 15;
        }

        const startX = (unscaledWidth - totalColsWidth) / 2;

        rowIndices.forEach((r) => {
          let currentX = startX;

          colIndices.forEach((c) => {
            const key = `${r}-${c}`;
            const student = seatingPlan[key];
            const status = seatStatuses[key] || 'available';

            // Desk Container Box
            ctx.fillStyle = status === 'unavailable' ? '#f1f5f9' : (status === 'restricted' ? '#fffbeb' : '#ffffff');
            ctx.strokeStyle = status === 'restricted' ? '#f59e0b' : (status === 'unavailable' ? '#cbd5e1' : '#cbd5e1');
            ctx.lineWidth = status === 'restricted' ? 2.5 : 1.5;

            ctx.beginPath();
            if (ctx.roundRect) {
              ctx.roundRect(currentX, currentY, cardSize, cardSize, 14);
            } else {
              ctx.rect(currentX, currentY, cardSize, cardSize);
            }
            ctx.fill();
            ctx.stroke();

            // Desk Coordinates Tag
            if (showCoordinates) {
              ctx.fillStyle = '#94a3b8';
              ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.textAlign = 'left';
              ctx.fillText(`R${r + 1}-C${c + 1}`, currentX + 12, currentY + 22);
            }

            if (student) {
              // Gender & Class No. Badge
              ctx.fillStyle = student.gender === 'M' ? '#2563eb' : '#db2777';
              ctx.beginPath();
              if (ctx.roundRect) {
                ctx.roundRect(currentX + cardSize - 44, currentY + 8, 36, 20, 6);
              } else {
                ctx.rect(currentX + cardSize - 44, currentY + 8, 36, 20);
              }
              ctx.fill();

              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(`#${student.classNo}`, currentX + cardSize - 26, currentY + 22);

              // Chinese Name
              ctx.fillStyle = '#0f172a';
              ctx.font = 'bold 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif';
              ctx.textAlign = 'center';
              
              const hasEn = Boolean(student.nameEn);
              ctx.fillText(student.nameZh || student.nameEn, currentX + (cardSize / 2), currentY + (hasEn ? 62 : 72));

              // English Name
              if (student.nameZh && student.nameEn) {
                ctx.fillStyle = '#475569';
                ctx.font = '500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText(student.nameEn, currentX + (cardSize / 2), currentY + 80);
              }

              // Badges: Height / Special Needs
              let badgeX = currentX + 10;
              if (student.isTall) {
                ctx.fillStyle = '#e0e7ff';
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(badgeX, currentY + cardSize - 26, 34, 18, 5);
                else ctx.fillRect(badgeX, currentY + cardSize - 26, 34, 18);
                ctx.fill();

                ctx.fillStyle = '#3730a3';
                ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Tall', badgeX + 17, currentY + cardSize - 13);
              }

              if (student.specialNeeds) {
                const snX = currentX + cardSize - 10;
                ctx.fillStyle = student.prioritizeFront ? '#fef3c7' : '#f1f5f9';
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(snX - 64, currentY + cardSize - 26, 64, 18, 5);
                else ctx.fillRect(snX - 64, currentY + cardSize - 26, 64, 18);
                ctx.fill();

                ctx.fillStyle = student.prioritizeFront ? '#92400e' : '#334155';
                ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.textAlign = 'center';

                let snLabel = student.specialNeeds;
                if (snLabel.length > 9) snLabel = snLabel.substring(0, 8) + '…';
                ctx.fillText(snLabel, snX - 32, currentY + cardSize - 13);
              }
            } else {
              ctx.fillStyle = '#94a3b8';
              ctx.font = '500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(status === 'unavailable' ? 'Blocked' : 'Empty', currentX + (cardSize / 2), currentY + 70);
            }

            currentX += cardSize;
            if (isAisleAfterColumn(c)) currentX += aisleGap;
            else currentX += gap;
          });

          }
          ctx.fill();

          ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('👩‍🏫 TEACHER BENCH / BLACKBOARD (FRONT)', unscaledWidth / 2, currentY + 31);

                          </label>
                          <label className="flex items-center space-x-1.5 text-slate-700 cursor-pointer">
                            <input type="checkbox" checked={customReqs.genderMix} onChange={(e) => setCustomReqs({ ...customReqs, genderMix: e.target.checked })} />
                            <span>🚻 Alternate Boy / Girl seating</span>
                          </label>
                          <label className="flex items-center space-x-1.5 text-slate-700 cursor-pointer">
                            <input type="checkbox" checked={customReqs.randomizeRemaining} onChange={(e) => setCustomReqs({ ...customReqs, randomizeRemaining: e.target.checked })} />
                            <span>🎲 Randomize remaining</span>
                          </label>
                        </div>
                      )}
                    </div>

                    <button
                      onClick={generatePlan}
                      className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-sm transition flex items-center justify-center space-x-2 text-xs sm:text-sm"
                    >
                      <Icon name="sparkles" className="w-4 h-4" />
                      <span>Generate Seating Plan</span>
                    </button>
                  </div>
                </div>

                {/* Right Board Canvas - Expanded Widescreen View */}
                <div className="lg:col-span-9 bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200 flex flex-col justify-between min-h-[600px]">
                  <div>
                    <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-100">
                      <div className="flex items-center space-x-2">
                        <span className="text-xs font-bold text-slate-600">View Perspective:</span>
                        <div className="bg-slate-100 p-1 rounded-xl flex space-x-1">
                          <button
                            onClick={() => setViewAngle('teacher')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition ${viewAngle === 'teacher' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'}`}
                          >
                            <Icon name="eye" className="w-3.5 h-3.5" />
                            <span>Teacher's View</span>
                          </button>
                          <button
                            onClick={() => setViewAngle('student')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition ${viewAngle === 'student' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'}`}
                          >
                            <Icon name="arrow-left-right" className="w-3.5 h-3.5" />
                            <span>Student's View</span>
                          </button>
                        </div>
                      </div>

                      <div className="flex flex-wrap items-center gap-2">
                        <button
                          onClick={exportAsDoc}
                          className="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold rounded-xl transition flex items-center space-x-1.5 border border-blue-200"
                        >
                          <Icon name="file-text" className="w-3.5 h-3.5" />
                          <span>Export DOC</span>
                        </button>

                        <button
                          onClick={() => exportHighResImage('png')}
                          className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl transition flex items-center space-x-1.5 shadow-sm"
                          title="Lossless high resolution output ideal for printing"
                        >
                          <Icon name="image" className="w-3.5 h-3.5" />
                          <span>HD PNG (300 DPI)</span>
                        </button>

                        <button
                          onClick={() => exportHighResImage('jpg')}
                          className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl transition flex items-center space-x-1.5 shadow-sm"
                          title="High resolution JPG image for quick printing"
                        >
                          <Icon name="image" className="w-3.5 h-3.5" />
                          <span>HD JPG (300 DPI)</span>
                        </button>
                      </div>
                    </div>

                    <div className="text-center my-4">
                      <h2 className="text-xl font-bold text-slate-900">CLASSROOM SEATING PLAN</h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Perspective: <span className="font-semibold capitalize">{viewAngle}'s View</span> | 
                        Seated: {Object.keys(seatingPlan).length} / {students.length}
                      </p>
                    </div>

                    {viewAngle === 'student' && (
                      <div className={`mb-6 flex ${
                        effectiveBenchPos === 'left' ? 'justify-start' :
                        effectiveBenchPos === 'right' ? 'justify-end' : 'justify-center'
                      }`}>
                        <div className="w-64 py-2.5 bg-slate-800 text-white rounded-xl text-center text-xs font-bold tracking-wider uppercase shadow-md flex items-center justify-center space-x-2">
                          <span>👩‍🏫 TEACHER BENCH / BLACKBOARD (FRONT)</span>
                        </div>
                      </div>
                    )}

                    {/* Canvas Container with Scaled Desk Items */}
                    <div className="w-full flex justify-center py-2">
                      <div className="flex flex-col space-y-2 sm:space-y-3 items-center">
                        {rowIndices.map((r) => (
                          <div key={r} className="flex space-x-1.5 sm:space-x-2 items-center">
                            {showCoordinates && <span className="text-[10px] font-bold text-slate-400 w-5 text-right flex-shrink-0">R{r + 1}</span>}

                            {colIndices.map((c) => {
                              const key = `${r}-${c}`;
                              const student = seatingPlan[key];
                              const status = seatStatuses[key] || 'available';
                              const hasAisle = isAisleAfterColumn(c);

                              return (
                                <React.Fragment key={c}>
                                  <div
                                    onClick={() => !student && toggleSeatStatus(r, c)}
                                    onContextMenu={(e) => handleContextMenu(e, r, c)}
                                    draggable={!!student}
                                    onDragStart={(e) => handleDragStart(e, key)}
                                    onDragOver={handleDragOver}
                                    onDrop={(e) => handleDrop(e, key)}
                                    className={`${deskStyle.card} rounded-2xl border-2 flex flex-col justify-between transition-all relative flex-shrink-0 ${
                                      status === 'unavailable'
                                        ? 'bg-slate-100 border-slate-200 text-slate-300 cursor-pointer'
                                        : status === 'restricted'
                                        ? 'bg-amber-50/60 border-amber-300 text-slate-700'
                                        : student
                                        ? 'bg-white border-indigo-200 shadow-sm hover:border-indigo-400 cursor-grab active:cursor-grabbing'
                                        : 'bg-slate-50 border-dashed border-slate-300 hover:border-indigo-300 cursor-pointer'
                                    }`}
                                  >
                                    <div className="flex justify-between items-center leading-none">
                                      {showCoordinates ? <span className={`${deskStyle.coord} font-semibold text-slate-400`}>R{r + 1}-C{c + 1}</span> : <span />}
                                      {student ? (
                                        <span className={`${deskStyle.badge} rounded-md font-black shadow-2xs ${
                                          student.gender === 'M' ? 'bg-blue-600 text-white' : 'bg-pink-600 text-white'
                                        }`}>
                                          #{student.classNo}
                                        </span>
                                      ) : (
                                        status === 'unavailable' ? <Icon name="ban" className="w-3 h-3 text-slate-400" /> :
                                        status === 'restricted' ? <Icon name="shield-alert" className="w-3 h-3 text-amber-500" /> : null
                                      )}
                                    </div>

                                    {student ? (
                                      <div className="text-center my-auto px-0.5">
                                        <div className={`font-bold ${deskStyle.title} text-slate-900 leading-tight truncate`}>
                                          {student.nameZh || student.nameEn}
                                        </div>
                                        {student.nameZh && student.nameEn && (
                                          <div className={`${deskStyle.sub} text-slate-500 font-medium truncate max-w-[95%] mx-auto mt-0.5`}>
                                            {student.nameEn}
                                          </div>
                                        )}
                                      </div>
                                    ) : (
                                      <div className="text-center my-auto text-[10px] text-slate-300 font-medium">
                                        {status === 'unavailable' ? 'Blocked' : 'Empty'}
                                      </div>
                                    )}

                                    <div className="flex items-center justify-between text-[8px] leading-none">
                                      {student?.isTall ? (
                                        <span className="bg-indigo-100 text-indigo-800 font-bold px-1 py-0.2 rounded">Tall</span>
                                      ) : <span />}

                                      {student?.specialNeeds && (
                                        <span className={`font-bold px-1 py-0.2 rounded truncate max-w-[65px] ${
                                          student.prioritizeFront ? 'bg-amber-100 text-amber-900' : 'bg-slate-100 text-slate-700'
                                        }`}>
                                          {student.specialNeeds}
                                        </span>
                                      )}
                                    </div>
                                  </div>

                                  {hasAisle && <div className={`${deskStyle.aisle} flex-shrink-0`} />}
                                </React.Fragment>
                              );
                            })}
                          </div>
                        ))}
                      </div>
                    </div>

                    {viewAngle === 'teacher' && (
                      <div className={`mt-6 flex ${
                        effectiveBenchPos === 'left' ? 'justify-start' :
                        effectiveBenchPos === 'right' ? 'justify-end' : 'justify-center'
                      }`}>
                        <div className="w-64 py-2.5 bg-slate-800 text-white rounded-xl text-center text-xs font-bold tracking-wider uppercase shadow-md flex items-center justify-center space-x-2">
                          <span>👩‍🏫 TEACHER BENCH / BLACKBOARD (FRONT)</span>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center text-[11px] text-slate-400">
                    <span>💡 <strong>Tip:</strong> Exports are generated at 300 DPI high resolution for razor-sharp physical printing.</span>
                    <span>Coordinates mode: {showCoordinates ? 'Visible' : 'Hidden'}</span>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
